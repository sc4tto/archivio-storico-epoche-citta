<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viaggio musicale geo-storico</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/documentation-panel.css?v=block07">
  <link rel="stylesheet" href="assets/transition-reliability.css?v=block11">
</head>
<body>
<header>
  <h1>Viaggio musicale geo-storico</h1>
  <p>
    Costruisci un percorso fra aree, periodi e centri usando soltanto
    tradizioni e scale collegate secondo lo stato documentale richiesto.
  </p>
</header>

<main>
  <section class="card">
    <div class="toolbar">
      <a class="button-link" href="ARCHIVE_BROWSER.html">Archivio locale</a>
      <a class="button-link" href="CENTER_MUSIC_CATALOG.html">Catalogo dei centri</a>
      <a id="verifiedModeLink" class="button-link primary" href="VIAGGIO_CENTRI.html">
        Torna ai dati documentati
      </a>
      
      <button id="addNode" class="primary" type="button">Aggiungi tappa</button>
      
      <button id="resetJourney" type="button">Azzera</button>
      <button id="calculateJourney" type="button">Calcola viaggio</button>
      <button id="exportJourney" type="button">Esporta JSON</button>
    </div>

    <div id="selectionModeBanner"></div>
    <p id="journeyStatus" class="status"></p>
  </section>

  <section class="card">
    <h2>Tappe del viaggio</h2>
    <div class="canvas-shell">
      <div id="journeyCanvas" class="journey-canvas center-journey-canvas"></div>
    </div>
  </section>

  <section class="card">
    <h2>Analisi delle transizioni</h2>
    <div id="journeyResults" class="results-grid"></div>
  </section>
</main>

<script src="defaults.js"></script>
<script src="generated/catalog.js?v=array-fix-v2"></script>
<script src="generated/center-music-index.js?v=array-fix-v2"></script>
<script src="generated/selection-policy.js"></script>
<script src="assets/theme-runtime.js"></script>
<script src="assets/center-journey.js?v=block11"></script>
</body>
</html>

<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalogo musicale dei centri</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header>
  <h1>Catalogo musicale dei centri</h1>
  <p>
    Vista complessiva dei profili musicali installati, filtrabile per
    periodo, area geografica, stato documentale e nome del centro.
  </p>
</header>

<main>
  <section class="card">
    <div class="toolbar">
      <a class="button-link primary" href="ARCHIVE_BROWSER.html">Archivio locale</a>
      <a class="button-link" href="VIAGGIO_CENTRI.html">Viaggio musicale</a>
    </div>
  </section>

  <section class="card">
    <h2>Filtri</h2>
    <div class="meta-grid">
      <div class="field">
        <label>Periodo</label>
        <select id="catalogPeriod"></select>
      </div>

      <div class="field">
        <label>Area</label>
        <select id="catalogArea"></select>
      </div>

      <div class="field">
        <label>Stato documentale</label>
        <select id="catalogStatus">
          <option value="">Tutti gli stati</option>
          <option value="documentato">Documentato</option>
          <option value="sintesi">Sintesi</option>
          <option value="inferito">Inferito</option>
          <option value="non_documentato">Non documentato</option>
        </select>
      </div>

      <div class="field">
        <label>Ricerca</label>
        <input id="catalogQuery" type="text" placeholder="Centro, area, profilo o descrizione">
      </div>
    </div>
  </section>

  <section class="card">
    <h2>Riepilogo</h2>
    <div id="catalogSummary" class="result-meta"></div>
  </section>

  <section class="card">
    <h2>Profili dei centri</h2>
    <div id="centerCatalogList" class="center-catalog-list"></div>
  </section>
</main>

<script src="defaults.js"></script>
<script src="generated/catalog.js"></script>
<script src="generated/center-music-index.js"></script>
<script src="assets/theme-runtime.js"></script>
<script src="assets/center-music-catalog.js"></script>
</body>
</html>
